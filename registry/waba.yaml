name: waba
binary: waba
description: "WhatsApp Cloud API from the terminal: messaging, media, templates, flows, calling, groups, analytics, and account management."
wraps: WhatsApp Cloud API
repo: https://github.com/jjuanrivvera/waba-cli
homepage: https://jjuanrivvera.github.io/waba-cli/
author: jjuanrivvera
install:
  brew: brew install jjuanrivvera/waba-cli/waba-cli
  scoop: scoop bucket add waba-cli https://github.com/jjuanrivvera/scoop-waba-cli && scoop install waba-cli
  go: go install github.com/jjuanrivvera/waba-cli/cmd/waba@latest
  script: curl -fsSL https://raw.githubusercontent.com/jjuanrivvera/waba-cli/main/install.sh | sh
tags: [messaging, whatsapp, ai-agent]
agent_ready: true
